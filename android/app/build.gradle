// Eventide for Android: the live site in the app's own WebView (MainActivity), like the Windows and Linux app, so
// it looks the same whichever browser the phone has. /.well-known/assetlinks.json names the signing key, so
// invite links open in the app (docs/APPS.md).
plugins {
    id 'com.android.application'
}

def host = 'eventide.vaibhavmann-10.workers.dev'

android {
    namespace = 'io.github.vaibhavmannq.eventide'
    compileSdk = 36

    defaultConfig {
        applicationId = 'io.github.vaibhavmannq.eventide'
        minSdk = 24 // Android 7.0
        targetSdk = 36
        // Set by the release workflow: the run number, which only grows, and the version being released.
        versionCode = (project.findProperty('versionCode') ?: '1') as int
        versionName = project.findProperty('versionName') ?: '0.1.0'

        manifestPlaceholders = [host: host]
        resValue 'string', 'home', "https://${host}"
    }

    // The key lives only in GitHub's secrets; the workflow writes it to a file for the build and deletes it after.
    signingConfigs {
        release {
            def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystore) {
                storeFile = file(keystore)
                storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias = 'eventide'
                keyPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig = signingConfigs.release
        }
    }

    // The site's address (resValue 'home' above) is a generated resource, which build tools 9 leave off by default.
    buildFeatures {
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

