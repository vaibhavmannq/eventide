[package]
name = "eventide-desktop"
version = "0.1.0"
description = "Eventide for Windows: the web app in its own window"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
base64 = "0.23.1"
getrandom = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
