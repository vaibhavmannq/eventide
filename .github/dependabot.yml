# Keeps dependencies current, but never with a release younger than a week: most hijacked npm and crates
# releases are caught and pulled within days. Security fixes are still proposed as soon as they are past it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      # Node's types follow the Node version in .nvmrc (and Cloudflare's runtime), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Minor and patch updates together; each major version on its own, to be read before it is merged.
      dependencies: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      # Minor and patch updates together; each major version on its own, to be read before it is merged.
      dependencies: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
