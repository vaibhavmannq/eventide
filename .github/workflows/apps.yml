name: Apps

# The Android APK and the Windows installer (docs/APPS.md).
# - On a pull request that touches them: build both, to show they still build. Nothing is signed or published.
# - Run by hand on main (Actions → Apps → Run workflow, with a version like 0.1.0): build signed copies and
#   publish them as a GitHub release, which the sign-in screen links to (releases/latest).
# Needs these repository secrets for a release: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD.
on:
  pull_request:
    paths: ['android/**', 'desktop/**', '.github/workflows/apps.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.1.0
        required: true

permissions:
  contents: read

env:
  RELEASING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, not '$VERSION'"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$RELEASING" != true ]; then
            echo "::error::Releases are made from main only"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'

      - name: Write the signing key to a file
        if: env.RELEASING == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret (docs/APPS.md)"; exit 1; fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/eventide.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/eventide.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        # On failure, Gradle's own explanation becomes an annotation on the run, readable without opening the log.
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon "-PversionName=$VERSION" "-PversionCode=$GITHUB_RUN_NUMBER" 2>&1 | tee build.log; then
            message=$(grep -A 20 "What went wrong" build.log | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${message:-see the log}"
            exit 1
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/eventide.keystore"

      - name: Name the APK
        run: |
          ls android/app/build/outputs/apk/release/
          if [ "$RELEASING" = true ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Eventide-android.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk Eventide-android-unsigned.apk
          fi

      - name: Keep it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: Eventide-android*.apk
          if-no-files-found: error

  android-on-a-phone:
    # The APK opened on an emulator (with Chrome), to catch an app that installs but closes at once.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'

      - name: Build a debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open it on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          script: .github/scripts/android-smoke.sh

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screen
          path: android-screen.png
          if-no-files-found: ignore

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Test the app's own code
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build the installer
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles nsis --config "{\"version\":\"$VERSION\"}"

      - name: Name the installer
        shell: bash
        run: cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe Eventide-windows-setup.exe

      - name: Keep it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: Eventide-windows-setup.exe
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported Ubuntu, so the .deb and AppImage run on as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Test the app's own code
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build the .deb and the AppImage
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles deb,appimage --config "{\"version\":\"$VERSION\"}"

      - name: Name them
        run: |
          cp desktop/src-tauri/target/release/bundle/deb/*.deb Eventide-linux-amd64.deb
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage Eventide-linux-x86_64.AppImage

      - name: Keep them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: Eventide-linux-*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [version, android, android-on-a-phone, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          **Android:** download `Eventide-android.apk` on your phone and open it. Android asks once to allow installing
          apps from your browser or files app; allow it. Updates install over the top.

          **Windows:** download `Eventide-windows-setup.exe` and run it. It is not signed with a paid certificate, so
          Windows SmartScreen may say "Windows protected your PC": choose **More info → Run anyway**. Signing in opens
          your browser once, then returns you to the app.

          **Linux:** `Eventide-linux-amd64.deb` for Ubuntu, Debian and Mint (`sudo apt install ./Eventide-linux-amd64.deb`),
          or `Eventide-linux-x86_64.AppImage` for any other distribution (`chmod +x` it, then run it).

          Nothing to install? Eventide also works in any browser.
          NOTES
          gh release create "v$VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Eventide $VERSION" --notes-file notes.md
