name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm test

      - name: Build the app
        run: npm run build -w @eventide/web

      - name: Bundle the Worker (no deploy)
        working-directory: packages/api
        run: npx wrangler deploy --dry-run --outdir dist

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Integration tests against Postgres 16
        run: npm run test:db

      - name: Crash test (server killed mid-write; nothing lost or doubled)
        run: npm run crash -- 10 20 8

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Dev database and the API's login
        run: |
          psql -h localhost -U postgres -c 'create database eventide_dev'
          DATABASE_URL=postgres://postgres@localhost:5432/eventide_dev npm run db:migrate
          psql -h localhost -U postgres -d eventide_dev -c "create role eventide_api_dev login password 'eventide_api_dev'; grant eventide_app to eventide_api_dev;"
          printf 'DEV_LOGIN=true\nSIGNUPS=open\nRATE_LIMITS=off\n' > packages/api/.dev.vars

      - name: Build the app
        run: npm run build -w @eventide/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (phone and laptop, real Workers runtime)
        run: npx playwright test

      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results/
          retention-days: 7
